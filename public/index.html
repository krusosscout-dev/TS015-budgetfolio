[hidden]{display:none!important}
img{max-width:100%}
/* Layout: หน้าแรกเต็มจอแบบพื้นไล่สีพาสเทล → ระบบมีเมนูข้าง (คอม) / เมนูล่าง (มือถือ) · งบแต่ละประเภทมีสีของตัวเอง */
:root{
  --bg:#f6f4fd; --surface:#ffffff; --surface2:#f8f6ff; --ink:#28233a; --muted:#6f6886; --line:#ebe7f6;
  --pri:#7a69f0; --pri-ink:#ffffff; --pri-soft:#ece8ff; --pri2:#f07aa8;
  --shadow:0 1px 2px rgba(60,40,120,.05),0 10px 28px rgba(90,70,170,.09);
  --shadow-lg:0 2px 6px rgba(60,40,120,.06),0 24px 60px rgba(90,70,170,.16);
  --lav:#e7e2ff; --lav-i:#5a49d4; --mint:#d3f4e5; --mint-i:#177f58; --sky:#d7ebff; --sky-i:#2765a6;
  --peach:#ffe2d1; --peach-i:#b4502a; --butter:#fff0bf; --butter-i:#7f600a; --rose:#ffdbe7; --rose-i:#ad2e63;
  --ok:#1b966a; --ok-s:#dbf5e9; --warn:#c77f00; --warn-s:#fff0cf; --bad:#d8456a; --bad-s:#ffe0e8; --info:#3a7bcc; --info-s:#e0ecff;
  --blob1:#d8d0ff; --blob2:#ffd3e4; --blob3:#c6f0dd; --blob4:#ffe6c4;
  --font-d:'IBM Plex Sans Thai',system-ui,sans-serif;
  --font-b:'IBM Plex Sans Thai',system-ui,sans-serif;
  --paper:#fffdf5; --paper-line:#cddff3; --paper-margin:#f2a3b5; --pen:#2b3d8f; --paper-edge:#efe6cf;
  --c-used:#7a69f0; --c-com:#f0a623; --c-left:#2bb57f;
  --lb1:#c8bbff; --lb2:#ffbdd7; --lb3:#aee9cf; --lb4:#ffd6ab;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --c-used:#a596ff; --c-com:#f3be55; --c-left:#5fd6a3; --lb1:#3a2f6e; --lb2:#4f2142; --lb3:#174636; --lb4:#4a3418;
  --bg:#15121e; --surface:#211c2d; --surface2:#29233a; --ink:#f1edfb; --muted:#a8a0bf; --line:#352e47;
  --pri:#a596ff; --pri-ink:#1a1430; --pri-soft:#2e2752; --pri2:#ff9cc2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3); --shadow-lg:0 24px 60px rgba(0,0,0,.45);
  --lav:#2f2857; --lav-i:#c8beff; --mint:#163a2d; --mint-i:#8fe5bf; --sky:#172e47; --sky-i:#9fcbff;
  --peach:#3d2418; --peach-i:#ffbd97; --butter:#383014; --butter-i:#f2d478; --rose:#3e1a2a; --rose-i:#ffa8c8;
  --ok:#5fd6a3; --ok-s:#173a2c; --warn:#f3be55; --warn-s:#3a2f12; --bad:#ff8aa6; --bad-s:#43192a; --info:#8dbcff; --info-s:#172c48;
  --blob1:#2d2554; --blob2:#3b1c33; --blob3:#15392c; --blob4:#3a2a16; color-scheme:dark;
  --paper:#28251f; --paper-line:#3b4658; --paper-margin:#86475a; --pen:#c4d2ff; --paper-edge:#1b1915;}}
:root[data-theme="dark"]{
  --c-used:#a596ff; --c-com:#f3be55; --c-left:#5fd6a3; --lb1:#3a2f6e; --lb2:#4f2142; --lb3:#174636; --lb4:#4a3418;
  --bg:#15121e; --surface:#211c2d; --surface2:#29233a; --ink:#f1edfb; --muted:#a8a0bf; --line:#352e47;
  --pri:#a596ff; --pri-ink:#1a1430; --pri-soft:#2e2752; --pri2:#ff9cc2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3); --shadow-lg:0 24px 60px rgba(0,0,0,.45);
  --lav:#2f2857; --lav-i:#c8beff; --mint:#163a2d; --mint-i:#8fe5bf; --sky:#172e47; --sky-i:#9fcbff;
  --peach:#3d2418; --peach-i:#ffbd97; --butter:#383014; --butter-i:#f2d478; --rose:#3e1a2a; --rose-i:#ffa8c8;
  --ok:#5fd6a3; --ok-s:#173a2c; --warn:#f3be55; --warn-s:#3a2f12; --bad:#ff8aa6; --bad-s:#43192a; --info:#8dbcff; --info-s:#172c48;
  --blob1:#2d2554; --blob2:#3b1c33; --blob3:#15392c; --blob4:#3a2a16; color-scheme:dark;
  --paper:#28251f; --paper-line:#3b4658; --paper-margin:#86475a; --pen:#c4d2ff; --paper-edge:#1b1915;}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;line-height:1.25;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 55%,transparent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
/* scrollbars */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 40%,transparent) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-button{display:none}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 35%,transparent);border-radius:8px}

/* type colors */
.t-teach{--t:var(--lav);--ti:var(--lav-i)} .t-dev{--t:var(--mint);--ti:var(--mint-i)} .t-proj{--t:var(--sky);--ti:var(--sky-i)}
.t-income{--t:var(--peach);--ti:var(--peach-i)} .t-own{--t:var(--butter);--ti:var(--butter-i)} .t-adv{--t:var(--rose);--ti:var(--rose-i)}

/* ---------- LANDING (one screen login) ---------- */
html:has(body.on-landing),body.on-landing{overflow:hidden}
.landing{position:fixed;inset:0;overflow:hidden;display:grid;place-items:center;padding-top:max(16px,env(safe-area-inset-top,0px))!important;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))!important;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.landing{background:linear-gradient(135deg,var(--lb1),var(--lb2) 50%,var(--lb4))}
.landing::before{content:"";position:absolute;inset:-20%;z-index:0;
  background:radial-gradient(45% 50% at 15% 20%,var(--lb1),transparent 70%),radial-gradient(40% 45% at 85% 15%,var(--lb2),transparent 70%),
  radial-gradient(45% 50% at 80% 85%,var(--lb3),transparent 70%),radial-gradient(40% 45% at 20% 90%,var(--lb4),transparent 70%);
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(2%,-2%) rotate(3deg)}}
.landing>*{position:relative;z-index:1}
.login{width:min(400px,100%);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:28px;box-shadow:var(--shadow-lg);padding:36px 32px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.login .logo{width:88px;height:88px;margin-bottom:10px;box-shadow:0 12px 28px rgba(170,120,230,.38)}
.login h1{font-size:28px;font-weight:700;letter-spacing:.2px}
.login .sub{color:var(--muted);font-size:14.5px;margin:0}
.login .fy{margin:14px 0 22px;font-size:13px;font-weight:600;color:var(--lav-i);background:var(--lav);padding:5px 14px;border-radius:99px}
.login-form{width:100%;display:flex;flex-direction:column;gap:10px}
.login-form .inp{text-align:center;font-size:16px;padding:13px 14px}
.btn-google svg{width:20px;height:20px}
.btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:600;
  background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line),0 4px 14px rgba(90,70,170,.08);transition:transform .15s,box-shadow .15s}
.btn-google:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1.5px var(--pri),0 8px 20px rgba(90,70,170,.14)}
.login .hint{font-size:12.5px;color:var(--muted);margin-top:12px}
.login .foot{font-size:11.5px;color:var(--muted);margin-top:16px;padding-top:12px;border-top:1px solid var(--line);width:100%}
.l-badge{position:absolute;top:16px;right:max(16px,env(safe-area-inset-right,0px));font-size:12px;padding:5px 12px;border-radius:99px;background:color-mix(in srgb,var(--surface) 75%,transparent);color:var(--muted)}
@media (max-height:440px){.login{gap:3px!important}.login .logo{width:44px!important;height:44px!important;margin:0!important}.login h1{font-size:22px}.login .sub,.login .hint{display:none}.login .foot{margin-top:8px!important;padding-top:8px!important}.login-form{gap:6px}.login-form .inp,.btn-google{padding-block:9px!important}}
@media (max-height:600px){.login{padding:22px 24px 16px}.login .logo{width:56px;height:56px;margin-bottom:4px}.login .fy{margin:8px 0 14px}.login .foot{margin-top:10px}}

.brand{display:flex;align-items:center;gap:12px}
.brand b{font-family:var(--font-d);font-size:20px;font-weight:700;letter-spacing:.2px;display:block;line-height:1.1}
.brand small{font-size:10.5px;letter-spacing:2.2px;color:var(--muted);font-weight:600}

/* ---------- SHELL ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:0;display:flex;flex-direction:column;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.side .brand{padding:22px 20px 20px;background:linear-gradient(135deg,var(--lav),var(--rose) 70%,var(--peach));border-bottom:1px solid var(--line)}
.side .brand small{letter-spacing:.4px;font-size:12px;font-weight:500;white-space:nowrap}
.side-nav{flex:1;min-height:0;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:4px}
.side-lab{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--muted);padding:2px 14px 6px}
.side-bot{border-top:1px solid var(--line);background:var(--surface2);padding:10px 12px 16px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:11px 14px;border-radius:14px;font-weight:500;color:var(--muted);text-align:left;transition:background .15s,color .15s}
.nav-btn:hover{background:var(--surface2);color:var(--ink)}
.nav-btn.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
.nav-btn svg{width:20px;height:20px;flex:none}
.nav-btn .nl{display:flex;flex-direction:column;line-height:1.3}
.nav-btn .nl small{font-size:11.5px;font-weight:400;opacity:.75}
.nav-btn .badge{margin-left:auto;font-size:11.5px;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--bad);color:#fff;display:grid;place-items:center;font-weight:600}
.sync-pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--ok-s);color:var(--ok);margin-bottom:8px;white-space:nowrap}
.side-foot{font-size:11.5px;color:var(--muted);padding:8px 14px 0;line-height:1.5}
.main{min-width:0;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.fy-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font-size:13.5px;font-weight:600}

.m-brand{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;font-weight:600;font-size:14.5px;background:var(--surface2);color:var(--ink);transition:transform .15s,filter .15s;text-decoration:none;white-space:nowrap}

.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--bad-s);color:var(--bad)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--surface);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.stat .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}

.stat .v{font-family:var(--font-d);font-size:clamp(19px,5.6vw,26px);font-weight:700;margin-top:4px;}
.stat .v small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.stat.hero{background:linear-gradient(135deg,var(--lav),var(--rose))}
.stat.hero .k{color:var(--lav-i)}

.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}

.panel-h .sub{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:10px}
.alert{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--a-s)}
.alert .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--a)}
.alert .ic svg{width:20px;height:20px}
.alert b{display:block;font-size:14.5px;color:var(--a);font-weight:600}
.alert span{font-size:13.5px;color:var(--ink);display:block}
.a-bad{--a:var(--bad);--a-s:var(--bad-s)} .a-warn{--a:var(--warn);--a-s:var(--warn-s)} .a-info{--a:var(--info);--a-s:var(--info-s)} .a-ok{--a:var(--ok);--a-s:var(--ok-s)} .a-rose{--a:var(--rose-i);--a-s:var(--rose)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty .big{font-size:40px;line-height:1;margin-bottom:8px}

/* timeline */
.tl{display:flex;flex-direction:column;gap:14px}
.tl-row .lab{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.tl-row .lab b{font-weight:600}
.bar{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.bar .u{background:var(--ti,var(--pri))}
.bar.money{background:var(--ok-s)}
.bar.money .u{background:var(--c-used)}
.bar.money .c{background:var(--c-com)}
.bar .c{background:var(--c-com)}
.bar .time{background:linear-gradient(90deg,var(--blob1),var(--pri))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:6px}

/* budget cards */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;padding:8px 14px;border-radius:99px;font-size:13.5px;font-weight:600;background:var(--surface);color:var(--muted);box-shadow:var(--shadow)}
.chip.on{background:var(--t,var(--pri-soft));color:var(--ti,var(--pri))}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.bcard{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.bcard-top{background:var(--t);padding:16px 18px 14px;position:relative}
.bcard-top .tag{font-size:12px;font-weight:600;color:var(--ti);display:flex;align-items:center;gap:6px}
.bcard-top h3{font-size:17px;font-weight:600;margin:6px 0 2px;color:var(--ink)}
.bcard-top .amt{font-family:var(--font-d);font-size:24px;font-weight:700;color:var(--ti)}
.bcard-top .amt small{font-size:13px;font-weight:500;color:var(--ink);opacity:.7;margin-left:4px}
.due{display:inline-block;margin-bottom:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface);color:var(--muted)}
.due.warn{color:var(--warn)} .due.bad{color:var(--bad)} .due.ok{color:var(--ok)}
.bcard-body{padding:14px 18px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{min-width:0}
.kv span{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.kv b{font-size:15px;font-weight:700;white-space:nowrap}
.kv div{border-radius:12px;padding:7px 10px}
.kv .k-u{background:color-mix(in srgb,var(--c-used) 13%,transparent)} .kv .k-u b{color:var(--c-used)}
.kv .k-c{background:color-mix(in srgb,var(--c-com) 16%,transparent)} .kv .k-c b{color:color-mix(in srgb,var(--c-com) 70%,var(--ink))}
.kv .k-l{background:color-mix(in srgb,var(--c-left) 15%,transparent)} .kv .k-l b{color:var(--c-left)}
.kv span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:currentColor}
.kv .k-u span::before{background:var(--c-used)} .kv .k-c span::before{background:var(--c-com)} .kv .k-l span::before{background:var(--c-left)}
.ov{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.donut-box{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{position:relative;flex:none}
.donut svg{display:block;transform:rotate(-90deg)}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.2}
.donut .ctr small{font-size:12px;color:var(--muted)}
.donut .ctr b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.dleg{display:flex;flex-direction:column;gap:8px;min-width:0}
.dleg .li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;line-height:1.35;gap:10px;align-items:center;font-size:14px;border:0;background:transparent;padding:6px 8px;border-radius:10px;text-align:left;width:100%;color:var(--ink)}
.dleg button.li:hover{background:var(--surface2)}
.dleg button.li.on{background:var(--t,var(--pri-soft));color:var(--ti,var(--pri));font-weight:600}
.dleg .sw{width:12px;height:12px;border-radius:4px}
.dleg .li span:nth-child(2){}

.dleg .li small{color:var(--muted);font-weight:400;margin-left:6px}
.bbars{display:flex;flex-direction:column;gap:12px;min-width:0}
.bbars .lab{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:5px}
.bbars .lab b{font-weight:600;min-width:0}
.bbars .meta span{white-space:nowrap}
.bbars .meta{display:flex;flex-wrap:wrap;column-gap:12px;row-gap:2px;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.bb-row{border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:12px;color:var(--ink);width:100%}
.bbars{gap:4px!important}
.bb-row:hover{background:var(--surface2)}
.bbars .lab span{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.acts{display:flex;flex-direction:column;gap:6px;background:var(--surface2);border-radius:14px;padding:10px 12px}
.acts-h{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;border:0;background:transparent;padding:4px 2px;text-align:left;width:100%;border-radius:8px;color:var(--ink)}
.act:hover{background:var(--surface)}
.act .an{font-size:13.5px;font-weight:500;}
.act .av{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

@media (max-width:980px){.ov{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.arow{grid-template-columns:minmax(0,1fr) 96px 38px}.arow .adue{grid-column:1/3}.arow-h{display:none}.donut-box{justify-content:center}}

.bcard-foot{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.bcard-foot .btn{flex:1}
.over{color:var(--bad)!important}

/* lists */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.lcard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px;border:0;text-align:left;width:100%;min-width:0;transition:transform .2s,box-shadow .2s}
.lcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.lcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lcard h3{font-size:16px;font-weight:600}
.status{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.st-plan{background:var(--warn-s);color:var(--warn)} .st-done{background:var(--ok-s);color:var(--ok)} .st-today{background:var(--bad-s);color:var(--bad)}
.lcard .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.lcard .tagline{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ti);background:var(--t);padding:3px 10px;border-radius:99px;align-self:flex-start;max-width:100%;}
.lcard .sum{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:10px}
.lcard .sum b{font-family:var(--font-d);font-size:20px}
.mini-items{font-size:13.5px;color:var(--ink);margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.mini-items li{display:flex;gap:8px;align-items:center;min-width:0}
.mini-items li span{}
.mini-items li i{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.mini-items li.b i{background:var(--ok)}
.mini-items li.b span{text-decoration:line-through;color:var(--muted)}

.seg{display:inline-flex;background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--pri-soft);color:var(--pri)}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tbl th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px 12px;background:var(--surface2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.typebar{display:flex;flex-direction:column;gap:12px}
.typebar .tl-row .lab span{color:var(--muted)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:0;background:var(--surface2);border-radius:12px;padding:11px 14px;outline:none;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .15s,background .15s;min-width:0}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--pri);background:var(--surface)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.inp{resize:vertical;min-height:70px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
.typepick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.typepick button{border:0;border-radius:14px;padding:10px 12px;background:var(--surface2);text-align:left;font-size:13.5px;font-weight:600;color:var(--muted);box-shadow:inset 0 0 0 2px transparent;min-width:0}
.typepick button.on{background:var(--t);color:var(--ti);box-shadow:inset 0 0 0 2px var(--ti)}
.typepick button small{display:block;font-weight:400;font-size:11.5px;opacity:.85}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:500}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+i{background:var(--ok)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:3px solid color-mix(in srgb,var(--pri) 55%,transparent);outline-offset:2px}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#1d1730 35%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(640px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:24px;box-shadow:var(--shadow-lg);animation:pop .25s cubic-bezier(.2,.9,.3,1.2);position:relative}
.modal::before{content:"";display:block;height:6px;background:linear-gradient(90deg,#a99bff,#f2a2c4,#ffd1a6,#a9e8cf)}

@keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 22px 6px}

.m-body{padding:12px 22px 18px;display:flex;flex-direction:column;gap:16px}

/* list editor items */
.items{display:flex;flex-direction:column;gap:8px}

.ihead{font-size:12px;color:var(--muted);font-weight:600;padding:0 4px}

.irow.b{background:var(--ok-s)}
.irow.b .nm{text-decoration:line-through;color:var(--muted)}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;margin:auto;padding:0;color:transparent}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ck svg{width:16px;height:16px}
.irow .ml{display:none}
.quick{display:flex;gap:6px;flex-wrap:wrap}

.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.totals div{background:var(--surface2);border-radius:14px;padding:12px 14px;min-width:0}

/* form sheet editor: A4 paper */
.fsheet-wrap{overflow:hidden;border-radius:14px;background:var(--surface2);padding:16px}
.fsheet{width:210mm;min-height:297mm;background:#fff;color:#1f2433;color-scheme:light;margin:0 auto;padding:16mm 15mm 15mm;font-family:var(--font-b);font-size:15px;line-height:1.5;box-shadow:0 6px 24px rgba(40,30,80,.14);border-radius:2px;transform-origin:top left;display:flex;flex-direction:column}

.fsheet .finfo .v{font-weight:400}
.fin{flex:1;min-width:0;border:0;border-bottom:1px dotted #9aa0ae;background:transparent;color:#1f2433;font:inherit;font-weight:400;padding:1px 4px;outline:none;border-radius:0}
.fin:focus{border-bottom:1.5px solid #6c7a96;background:#f5f7fb}
select.fin{appearance:auto}
.ftitle{font-size:19px;font-weight:600;color:#1f2433;margin:0 0 10px}
.ftbl{width:100%;border-collapse:collapse;font-size:15.5px}
.ftbl th{background:#f6f8fc;font-weight:700;color:#1f2433;padding:10px 8px;border:1px solid #e3e8f2;border-left:0;border-right:1px solid #e3e8f2;text-align:center}
.ftbl th:first-child{text-align:left;border-left:1px solid #e3e8f2}
.ftbl th.r{text-align:right}
.ftbl td{border-bottom:1px solid #e9edf4;padding:3px 2px;vertical-align:middle}

    for(const l of S.lists){const key=l.receipt?String(l.receipt.length)+l.receipt.slice(-40):'';if(rcpSent[l.id]!==key){if(l.receipt)await api('/api/receipt?id='+encodeURIComponent(l.id),{method:'PUT',body:JSON.stringify({img:l.receipt})});else if(rcpSent[l.id])await api('/api/receipt?id='+encodeURIComponent(l.id),{method:'DELETE'});rcpSent[l.id]=key}}
    for(const id of Object.keys(rcpSent)){if(!S.lists.some(l=>l.id===id)){if(rcpSent[id])await api('/api/receipt?id='+encodeURIComponent(id),{method:'DELETE'}).catch(()=>{});delete rcpSent[id]}}
    setSync('synced');

const itemEst=i=>num(i.qty)*num(i.est);
const itemAct=i=>num(i.qty)*(i.act===''||i.act==null?num(i.est):num(i.act));
const listEst=l=>l.items.reduce((s,i)=>s+itemEst(i),0);
const listAct=l=>l.items.filter(i=>i.bought).reduce((s,i)=>s+itemAct(i),0);
const listPending=l=>l.status==='done'?0:l.items.filter(i=>!i.bought).reduce((s,i)=>s+itemEst(i),0);
const budget=id=>S.budgets.find(b=>b.id===id);
const fyBudgets=()=>S.budgets.filter(b=>b.fy===S.settings.fy);
const listsOf=id=>S.lists.filter(l=>l.budgetId===id);
function calc(b){
  const ls=listsOf(b.id);const used=ls.reduce((s,l)=>s+listAct(l),0);const com=ls.reduce((s,l)=>s+listPending(l),0);
  const amt=num(b.amount);const left=amt-used;const free=amt-used-com;
  let time=null;if(b.due&&b.start){const tot=diffDays(b.start,b.due);time=tot>0?Math.min(1,Math.max(0,diffDays(b.start,today())/tot)):1}
  const pend=b.type==='adv'?ls.filter(l=>!l.reimbursed).reduce((s,l)=>s+listAct(l),0):0;
  return {used,com,amt,left,free,time,pend,count:ls.length,dl:b.due?diffDays(today(),b.due):null};
}
function fyFiltered(l){const b=budget(l.budgetId);return b&&b.fy===S.settings.fy}

    if(b.type==='adv'){ if(c.pend>0)out.push({lv:'rose',ic:'coin',t:'รอเบิกคืน',x:`${n} · สำรองจ่ายไป ${money(c.pend)} บาท ยังไม่ได้เบิกคืน`,a:`editBudget:${b.id}`,al:'ดูรายการ',o:2}); return; }
    let flagged=false;

      else if(c.dl<=30){out.push({lv:'warn',ic:'clock',t:`อีก ${c.dl} วันต้องใช้งบ`,x:`${n} · ยังไม่ได้ใช้ ${money(c.left)} บาท (ใช้ภายใน ${fd(b.due)})`,a:`newList:${b.id}`,al:'เขียนใบรายการ',o:1});flagged=true}
    }
    (b.acts||[]).forEach(a=>{const ac=actCalc(b,a);if(a.due&&ac.free>0.5&&ac.dl!==null&&ac.dl<=30){out.push({lv:ac.dl<0?'bad':'warn',ic:'clock',t:ac.dl<0?'กิจกรรมเลยกำหนดแล้ว':`อีก ${ac.dl} วันถึงกิจกรรม`,x:`${esc(a.name)} (${n}) · ยังเหลือ ${money(ac.free)} บาท`,a:`newList:${b.id}|${a.id}`,al:'เขียนใบรายการ',o:ac.dl<0?0:1})}});

  });

function donut(segs,size,center){const r=size/2-12,C=2*Math.PI*r,tot=segs.reduce((a,x)=>a+Math.max(0,x.v),0)||1;let off=0;const nz=segs.filter(x=>x.v>0);
  const arcs=nz.map(x=>{const len=x.v/tot*C;const gap=nz.length>1?2:0;const el=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${x.c}" stroke-width="20" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}"/>`;off+=len;return el}).join('');
  return `<div class="donut" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="20"/>${arcs}</svg><div class="ctr">${center}</div></div>`}
const TCOL={teach:'var(--lav-i)',dev:'var(--mint-i)',proj:'var(--sky-i)',income:'var(--peach-i)',own:'var(--butter-i)',adv:'var(--rose-i)'};

function actCalc(b,a){const ls=S.lists.filter(l=>l.budgetId===b.id&&l.actId===a.id);const used=ls.reduce((s,l)=>s+listAct(l),0),com=ls.reduce((s,l)=>s+listPending(l),0),amt=num(a.amount);return {used,com,amt,free:amt-used-com,dl:a.due?diffDays(today(),a.due):null}}
function moneyBar(used,com,amt){const pu=amt?Math.min(100,used/amt*100):0,pc=amt?Math.min(100-pu,com/amt*100):0;return `<div class="bar money"><i class="u" style="width:${pu}%"></i><i class="c" style="width:${pc}%"></i></div>`}
async function dl(filename,data){try{const ext=(filename.split('.').pop()||'').toLowerCase();const mime={json:'application/json',csv:'text/csv;charset=utf-8',html:'text/html;charset=utf-8'}[ext]||'application/octet-stream';
  const b=data instanceof Blob?data:new Blob([data],{type:mime});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('ดาวน์โหลดแล้ว');return true}

function dueChip(b,c){if(!b.due)return b.type==='adv'?'':'<span class="due">ไม่มีกำหนด</span>';
  if(c.left<=0.5&&b.type!=='adv')return '<span class="due ok">ใช้ครบแล้ว</span>';
  if(c.dl<0)return `<span class="due bad">เลยกำหนด ${-c.dl} วัน</span>`;
  if(c.dl<=30)return `<span class="due warn">อีก ${c.dl} วัน</span>`;
  return `<span class="due">ใช้ภายใน ${fd(b.due)}</span>`}
function bcard(b){const c=calc(b);const T=TYPES[b.type];
  if(b.type==='adv'){return `<article class="bcard t-adv"><div class="bcard-top"><div class="tag">${T.emoji} ${T.label}</div><h3>${esc(b.name)}</h3>
    <div class="amt num">${money(c.pend)}<small>บาท รอเบิกคืน</small></div></div>
    <div class="bcard-body"><div class="kv"><div><span>สำรองจ่ายรวม</span><b class="num">${money(c.used)}</b></div><div><span>เบิกคืนแล้ว</span><b class="num">${money(c.used-c.pend)}</b></div><div><span>ใบรายการ</span><b>${c.count}</b></div></div>
    ${b.note?`<div style="font-size:13px;color:var(--muted)">${esc(b.note)}</div>`:''}
    <div class="bcard-foot"><button class="btn sm soft" data-act="newList:${b.id}">${I('plus')}ใบรายการ</button><button class="btn sm" data-act="viewBudget:${b.id}">${I('list')}รายละเอียด</button></div></div></article>`}
  return `<article class="bcard t-${b.type}"><div class="bcard-top" data-act="viewBudget:${b.id}" style="cursor:pointer" title="ดูรายละเอียดและกิจกรรมย่อย">${dueChip(b,c)}<div class="tag">${T.emoji} ${T.label}${b.sub?` · ${esc(b.sub)}`:''}</div><h3>${esc(b.name)}</h3>
    <div class="amt num">${money(c.amt)}<small>บาท</small></div></div>
    <div class="bcard-body">${moneyBar(c.used,c.com,c.amt)}
    <div class="kv"><div class="k-u"><span>ใช้แล้ว</span><b class="num">${money(c.used)}</b></div><div class="k-c"><span>จองไว้</span><b class="num">${money(c.com)}</b></div><div class="k-l"><span>คงเหลือ</span><b class="num ${c.free<0?'over':''}">${money(c.free)}</b></div></div>
    ${(b.acts&&b.acts.length)?`<div class="acts"><div class="acts-h"><span>กิจกรรมย่อย ${b.acts.length} · ใช้เงินจากงบนี้</span>${(()=>{const un=c.amt-b.acts.reduce((s,a)=>s+num(a.amount),0);return un>0.5?`<span>ยังไม่แบ่ง ${money(un)}</span>`:''})()}</div>
      ${b.acts.map(a=>{const ac=actCalc(b,a);return `<button class="act" data-act="newList:${b.id}|${a.id}" title="เขียนใบรายการของกิจกรรมนี้"><span class="an">${esc(a.name)}</span><span class="av">${money(ac.used+ac.com)} / ${money(ac.amt)}</span>${moneyBar(ac.used,ac.com,ac.amt)}${a.due&&ac.free>0.5&&ac.dl!==null&&ac.dl<=30?`<span class="ad">${ac.dl<0?'เลยกำหนด '+(-ac.dl)+' วัน':'อีก '+ac.dl+' วัน'}</span>`:''}</button>`}).join('')}</div>`:`<button class="btn sm ghost" style="justify-content:flex-start" data-act="editBudget:${b.id}">${I('plus')}เพิ่มกิจกรรมย่อย</button>`}
    ${b.note?`<div style="font-size:13px;color:var(--muted)">${esc(b.note)}</div>`:''}
    <div class="bcard-foot"><button class="btn sm soft" data-act="newList:${b.id}">${I('plus')}ใบรายการ</button><button class="btn sm" data-act="viewBudget:${b.id}">${I('list')}รายละเอียด</button></div></div></article>`}
function vBudgets(){

      ${TKEYS.filter(k=>counts[k]).map(k=>`<button class="li t-${k} ${filterType===k?'on':''}" data-act="ftype:${k}"><span class="sw" style="background:${TCOL[k]}"></span><span>${TYPES[k].label}</span><b>${money(sums[k]||0)}<small>${k==='adv'?'สำรองจ่าย':counts[k]+' งบ'}</small></b></button>`).join('')}</div></div></section>`})()}

function lcard(l){const b=budget(l.budgetId);const t=today();const done=l.status==='done';const n=l.items.length,nb=l.items.filter(i=>i.bought).length;

  return `<button class="lcard t-${b?b.type:'teach'}" data-act="openList:${l.id}"><div class="top"><h3>${esc(l.title||'ใบรายการ (ยังไม่ตั้งชื่อ)')}</h3>${st}</div>
    <span class="tagline">${b?TYPES[b.type].emoji+' '+esc(b.name)+(actOf(b,l.actId)?' · '+esc(actOf(b,l.actId).name):''):'ยังไม่เลือกงบ'}</span>
    <div class="meta"><span>${I('cal',1.6).replace('<svg','<svg width="14" height="14" style="vertical-align:-2px;margin-right:4px"')}${fd(done&&l.doneDate?l.doneDate:l.date)}</span>${l.shop?`<span>${esc(l.shop)}</span>`:''}${b&&b.type==='adv'&&done?`<span style="color:${l.reimbursed?'var(--ok)':'var(--rose-i)'}">${l.reimbursed?'เบิกคืนแล้ว':'รอเบิกคืน'}</span>`:''}</div>
    <ul class="mini-items">${l.items.slice(0,3).map(i=>`<li class="${i.bought?'b':''}"><i></i><span>${esc(i.name||'-')} ${num(i.qty)?money(num(i.qty))+' '+esc(i.unit):''}</span></li>`).join('')}${n>3?`<li style="color:var(--muted)"><i style="background:none"></i><span>และอีก ${n-3} รายการ</span></li>`:''}</ul>
    <div class="sum"><span style="font-size:13px;color:var(--muted)">${done?'จ่ายจริง':`ซื้อแล้ว ${nb}/${n}`}</span><b class="num">${money(done?listAct(l):listEst(l))} <small style="font-size:13px;font-weight:500;color:var(--muted)">บาท</small></b></div></button>`}
function vLists(){

}

function histRows(){const rows=[];S.lists.filter(fyFiltered).forEach(l=>{if(histBudget!=='all'&&l.budgetId!==histBudget)return;const b=budget(l.budgetId);
  l.items.filter(i=>i.bought).forEach(i=>rows.push({date:l.doneDate||l.date,name:i.name,qty:num(i.qty),unit:i.unit,price:i.act===''?num(i.est):num(i.act),total:itemAct(i),b,shop:l.shop,list:l}))});
  return rows.sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function vHistory(){

  const byList=done.length?`<div style="display:flex;flex-direction:column;gap:12px">${done.map(l=>{const b=budget(l.budgetId);const its=l.items.filter(i=>i.name.trim());return `<div class="t-${b.type}" style="background:var(--surface2);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px">

function thDate(id,val,cls,{lf='',allowEmpty=false}={}){
  return `<button type="button" class="${cls} dpick ${val?'':'empty'}" data-dp="${id}" data-empty="${allowEmpty?1:0}"><span>${val?fdFull(val):(allowEmpty?'ไม่กำหนด':'เลือกวันที่')}</span>${I('cal')}</button><input type="hidden" id="${id}" ${lf?`data-lf="${lf}"`:''} value="${esc(val||'')}">`;
}
let dp=null;
function dpClose(){const e=$('.dp-pop');if(e)e.remove();dp=null}
function dpOpen(btn){dpClose();const h=$('#'+btn.dataset.dp);const v=h.value||today();const d=parse(v);dp={btn,h,y:d.getFullYear(),m:d.getMonth(),allow:btn.dataset.empty==='1'};
  const el=document.createElement('div');el.className='dp-pop';el.setAttribute('role','dialog');el.setAttribute('aria-label','เลือกวันที่');document.body.appendChild(el);dpDraw();
  dpPos();}
function dpPos(){const el=$('.dp-pop');if(!el||!dp)return;const r=dp.btn.getBoundingClientRect(),W=innerWidth,H=innerHeight,pw=Math.min(292,W-16),ph=el.offsetHeight;el.style.width=pw+'px';
  if(r.bottom<0||r.top>H){dpClose();return}
  let left=Math.min(Math.max(8,r.left),W-pw-8),top=r.bottom+6;if(top+ph>H-8)top=Math.max(8,r.top-ph-6);el.style.left=left+'px';el.style.top=top+'px';}
function dpDraw(){const el=$('.dp-pop');if(!el||!dp)return;const {y,m}=dp;const first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();const sel=dp.h.value,t=today();

function fitSheet(){const sw=$('#sw');const sh=$('#sw .sheet');if(!sw||!sh)return;const w=sw.clientWidth-32;const full=sh.offsetWidth;const k=Math.min(1,w/full);sh.style.transform=`scale(${k})`;sh.style.marginBottom=`${-(1-k)*sh.offsetHeight}px`;sh.style.marginLeft=k<1?'0':'auto'}
window.addEventListener('resize',fitSheet);

function resizeImg(file,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=900,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};img.src=r.result};r.readAsDataURL(file)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const pk=e.target.closest('[data-dp]');if(pk){e.preventDefault();if(dp&&dp.btn===pk)dpClose();else dpOpen(pk);return}
  if(e.target.closest('.dp-pop')){const nv=e.target.closest('[data-dpn]');const dd=e.target.closest('[data-dpd]');
    if(nv){dp.m+=+nv.dataset.dpn;if(dp.m<0){dp.m=11;dp.y--}if(dp.m>11){dp.m=0;dp.y++}dpDraw()}else if(dd)dpPick(dd.dataset.dpd);return}
  if(dp)dpClose();
  const el=e.target.closest('[data-act]');if(!el)return;
  const [a,arg]=el.dataset.act.split(/:(.*)/s);
  if(a==='bgclose'){if(e.target===el)closeModal();return}
  switch(a){
    case 'enter':entered=true;render();if(!online)dbInit();break;
    case 'signout':TOKEN='';online=false;try{localStorage.removeItem('bf-token')}catch(e){}entered=false;render();toast('ออกจากระบบแล้ว');break;
    case 'install':if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;const b=$('#install-btn');if(b)b.hidden=true})}break;
    case 'lineTest':{const b=el;b.disabled=true;api('/api/line-notify?test=1',{method:'POST'}).then(r=>toast(r.sent?'ส่งข้อความทดสอบเข้า LINE แล้ว':(r.reason||'ยังไม่ได้ส่ง'))).catch(e=>{if(e.code!=='auth')toast(e.message||'ส่งไม่สำเร็จ')}).finally(()=>{b.disabled=false});break}
    case 'logout':closeModal();entered=false;render();window.scrollTo({top:0});break;
    case 'nav':view=arg;renderShell();break;
    case 'close':closeModal();break;
    case 'ftype':filterType=arg;renderView();break;
    case 'lf':listFilter=arg;renderView();break;
    case 'hm':histMode=arg;renderView();break;
    case 'newBudget':budgetModal();break;
    case 'editBudget':closeModal();budgetModal(arg);break;
    case 'viewBudget':closeModal();viewBudget(arg);break;
    case 'btype':readBudgetForm();bDraft.type=arg;if(!TYPES[arg].subs)bDraft.sub='';else if(!bDraft.sub)bDraft.sub=TYPES[arg].subs[0];drawBudgetModal(!!budget(bDraft.id));break;
    case 'saveBudget':saveBudget();break;
    case 'addAct':{readBudgetForm();(bDraft.acts=bDraft.acts||[]).push({id:uid(),name:'',amount:'',due:''});drawBudgetModal(!!budget(bDraft.id));const r=document.querySelectorAll('[data-af="name"]');if(r.length)r[r.length-1].focus();break}
    case 'delAct':readBudgetForm();bDraft.acts=bDraft.acts.filter(a=>a.id!==arg);drawBudgetModal(!!budget(bDraft.id));break;
    case 'delBudget':{const b=budget(arg);const n=listsOf(arg).length;confirmBox('ลบงบนี้?',`"${esc(b.name)}"${n?` และใบรายการ ${n} ใบของงบนี้`:''} จะถูกลบ ย้อนกลับไม่ได้`,'ลบงบ',()=>{S.budgets=S.budgets.filter(x=>x.id!==arg);S.lists=S.lists.filter(l=>l.budgetId!==arg);save(true);toast('ลบงบแล้ว');renderShell()});break}
    case 'newList':closeModal();newList(arg||'');break;
    case 'openList':closeModal();openList(arg);break;
    case 'addItem':{curList.items.push(blankItem());redrawRows(true);break}
    case 'quick':{const [n,u,p]=QUICK[+arg].split('|');const blank=curList.items.find(i=>!i.name.trim()&&!num(i.est));const it=blank||{id:uid(),act:'',bought:false};Object.assign(it,{name:n,unit:u,est:p,qty:it.qty||1});if(!blank)curList.items.push(it);redrawRows();break}
    case 'delItem':curList.items=curList.items.filter(i=>i.id!==arg);redrawRows();break;
    case 'ck':{const it=curList.items.find(i=>i.id===arg);it.bought=!it.bought;redrawRows();break}
    case 'finish':{const l=curList;l.items=l.items.filter(i=>i.name.trim()||num(i.est));if(!l.items.length){toast('ยังไม่มีรายการ');return}
      l.items.forEach(i=>i.bought=true);l.status='done';l.doneDate=today();delete l.isNew;save(true);toast('บันทึกว่าซื้อเสร็จแล้ว หักงบให้แล้ว');drawList();break}
    case 'reopen':curList.status='plan';save();drawList();break;
    case 'delList':{const l=S.lists.find(x=>x.id===arg);onClose=null;const keep=curList;confirmBox('ลบใบรายการนี้?',`"${esc(l.title||'ใบรายการ')}" จะถูกลบ ยอดที่หักงบไว้จะคืนกลับ`,'ลบใบรายการ',()=>{S.lists=S.lists.filter(x=>x.id!==arg);curList=null;save(true);toast('ลบใบรายการแล้ว');renderShell()},keep?()=>{curList=keep;drawList()}:null);break}
    case 'printList':{if(curList){curList.items=curList.items.filter(i=>i.name.trim()||num(i.est));save(true)}printList(arg);break}
    case 'doPrint':{window.print();break}
    case 'dlReport':{$('#print-root').innerHTML=reportHTML();window.print();break}
    case 'report':openModal(`<div class="m-head"><h2>รายงานสรุปปีงบประมาณ ${S.settings.fy}</h2><button class="btn icon ghost" data-act="close" aria-label="ปิด">${I('x')}</button></div>
      <div class="m-body"><div class="sheet-wrap" id="sw">${reportHTML()}</div><div class="fhint">กดพิมพ์ แล้วเลือกเครื่องพิมพ์ หรือเลือก "บันทึกเป็น PDF"</div></div>
      <div class="m-foot"><button class="btn ghost" data-act="close">ปิด</button><button class="btn pri" data-act="dlReport">${I('print')}พิมพ์ / บันทึก PDF</button></div>`,{wide:true});fitSheet();break;
    case 'dupList':{const o=S.lists.find(x=>x.id===arg);if(!o)break;const b=budget(o.budgetId)&&budget(o.budgetId).fy===S.settings.fy?o.budgetId:(fyBudgets()[0]||{}).id;if(!b){toast('เพิ่มงบก่อน');break}
      const n={id:uid(),budgetId:b,actId:b===o.budgetId?(o.actId||''):'',title:(o.title||'ใบรายการ')+' (สำเนา)',date:today(),shop:o.shop||'',status:'plan',reimbursed:false,receipt:null,items:o.items.filter(i=>i.name.trim()).map(i=>({id:uid(),name:i.name,qty:i.qty,unit:i.unit,est:i.act!==''&&i.act!=null?i.act:i.est,act:'',bought:false}))};
      S.lists.push(n);save(true);onClose=null;closeModal();toast('คัดลอกใบรายการแล้ว');view='lists';listFilter='plan';renderShell();openList(n.id);break}
    case 'backup':{const data=JSON.stringify({app:'BudgetFolio',exported:new Date().toISOString(),state:S},null,1);dl('BudgetFolio-สำรอง-'+today()+'.json',data);break}
    case 'csv':{const rows=[];S.lists.filter(l=>l.status==='done').forEach(l=>{const b=budget(l.budgetId);if(!b)return;const a=actOf(b,l.actId);l.items.filter(i=>i.name.trim()).forEach(i=>rows.push([b.fy,fdFull(l.doneDate||l.date),i.name,num(i.qty),i.unit,i.act===''?num(i.est):num(i.act),itemAct(i),TYPES[b.type].label,b.name,a?a.name:'',l.title||'',l.shop||'']))});
      const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const csv='\ufeff'+[['ปีงบ','วันที่ซื้อ','รายการ','จำนวน','หน่วย','ราคาต่อหน่วย','รวม','ประเภทงบ','ชื่องบ','กิจกรรม','ใบรายการ','ร้าน'],...rows].map(r=>r.map(q).join(',')).join('\r\n');
      dl('BudgetFolio-ประวัติการซื้อ-'+today()+'.csv',csv);break}
    case 'copyAlerts':{const al=alerts();const tx=al.length?('BudgetFolio · เรื่องงบที่ต้องจัดการ ('+fdFull(today())+')\n'+al.map(a=>'• '+a.t+': '+a.x.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&')).join('\n')):'BudgetFolio · ไม่มีงบที่ต้องรีบใช้ตอนนี้';
      const fb=()=>{const ta=document.createElement('textarea');ta.value=tx;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('คัดลอกแล้ว วางใน LINE ได้เลย')}catch(x){toast('คัดลอกไม่ได้')}ta.remove()};
      if(navigator.clipboard)navigator.clipboard.writeText(tx).then(()=>toast('คัดลอกแล้ว วางใน LINE ได้เลย'),fb);else fb();break}
    case 'delReceipt':curList.receipt=null;save();drawList();break;
    case 'copyHist':{const rows=histRows();const tsv=['วันที่\tรายการ\tจำนวน\tหน่วย\tราคาต่อหน่วย\tรวม\tงบ\tร้าน',...rows.map(r=>[fdFull(r.date),r.name,r.qty,r.unit,r.price,r.total,r.b.name,r.shop||''].join('\t'))].join('\n');
      const fb=()=>{const ta=document.createElement('textarea');ta.value=tsv;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('คัดลอกแล้ว วางใน Excel ได้เลย')}catch(x){toast('คัดลอกไม่ได้')}ta.remove()};
      if(navigator.clipboard)navigator.clipboard.writeText(tsv).then(()=>toast('คัดลอกแล้ว วางใน Excel ได้เลย'),fb);else fb();break}
    case 'resetSample':confirmBox('โหลดข้อมูลตัวอย่างใหม่?','ข้อมูลที่มีอยู่จะถูกแทนที่ด้วยข้อมูลตัวอย่าง','โหลดตัวอย่าง',()=>{const th=S.settings.theme;S=sample();S.settings.theme=th;save(true);toast('โหลดข้อมูลตัวอย่างแล้ว');renderShell()});break;
    case 'clearAll':confirmBox('ลบข้อมูลทั้งหมด?','งบและใบรายการทั้งหมดจะถูกลบ ย้อนกลับไม่ได้ (ควรดาวน์โหลดไฟล์สำรองไว้ก่อน)','ลบทั้งหมด',()=>{S.budgets=[];S.lists=[];S.isSample=false;save(true);toast('ลบข้อมูลแล้ว');renderShell()});break;
  }
});
function redrawRows(focusLast){const l=curList;padItems(l);$('#irows').innerHTML=l.items.map((i,k)=>irow(i,k)).join('');updTotals();save();
  if(focusLast){const ins=document.querySelectorAll('#irows .nm');if(ins.length)ins[ins.length-1].focus()}fitForm();}
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.f&&curList){const it=curList.items.find(i=>i.id===t.dataset.i);if(!it)return;it[t.dataset.f]=t.value;
    const tot=$(`[data-tot="${it.id}"]`);if(tot)tot.textContent=money2(curList.status==='done'?itemAct(it):itemEst(it));
    updTotals();save();return}
  if(t.dataset.lf&&curList){curList[t.dataset.lf]=t.value;if(t.dataset.lf==='doneDate'){} save();return}
  if(t.dataset.af==='amount'||t.id==='bf-amt')updActUn();
  if(t.id==='st-teacher'){S.settings.teacher=t.value;save()}
  if(t.id==='st-school'){S.settings.school=t.value;save()}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='lf-b'&&curList){curList.budgetId=t.value;curList.actId='';save();drawList();return}
  if(t.id==='lf-reimb'&&curList){curList.reimbursed=t.checked;save();toast(t.checked?'บันทึกว่าเบิกคืนแล้ว':'กลับเป็นรอเบิกคืน');return}
  if(t.id==='imp-file'&&t.files[0]){const f=t.files[0];t.value='';const r=new FileReader();r.onload=()=>{let o=null;try{o=JSON.parse(r.result);o=o&&o.state?o.state:o}catch(e){}
    if(!o||!Array.isArray(o.budgets)||!Array.isArray(o.lists)){toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของ BudgetFolio');return}
    confirmBox('นำเข้าไฟล์สำรอง?',`งบ ${o.budgets.length} รายการ และใบรายการ ${o.lists.length} ใบ จะแทนที่ข้อมูลปัจจุบันทั้งหมด`,'นำเข้า',()=>{const th=S.settings.theme;S=o;S.isSample=false;S.settings=Object.assign({teacher:'',school:'',fy:fyOf(today()),theme:th},S.settings||{});save(true);applyTheme();toast('นำเข้าข้อมูลแล้ว');renderShell()})};r.readAsText(f);return}
  if(t.id==='lf-receipt'&&curList&&t.files[0]){resizeImg(t.files[0],d=>{curList.receipt=d;save(true);drawList();toast('แนบรูปใบเสร็จแล้ว')});return}
  if(t.id==='st-fy'){S.settings.fy=+t.value;S.settings.fyManual=(+t.value!==fyOf(today()));save(true);toast('เปลี่ยนเป็นปีงบประมาณ '+t.value);renderShell()}
  if(t.id==='st-theme'){S.settings.theme=t.value;save(true);applyTheme()}
  if(t.id==='hist-b'){histBudget=t.value;renderView()}
});
document.addEventListener('submit',async e=>{if(e.target.id!=='login-form')return;e.preventDefault();const pw=$('#pw').value;const btn=$('#login-btn');const msg=$('#login-msg');btn.disabled=true;btn.textContent='กำลังตรวจ…';
  try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});const j=await r.json().catch(()=>({}));
    if(!r.ok){msg.textContent=j.error||'เข้าสู่ระบบไม่สำเร็จ';msg.style.color='var(--bad)';btn.disabled=false;btn.textContent='เข้าสู่ระบบ';$('#pw').select();return}
    TOKEN=j.token;try{localStorage.setItem('bf-token',TOKEN)}catch(x){}entered=true;render();dbInit();
  }catch(x){msg.textContent='เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่';msg.style.color='var(--bad)';btn.disabled=false;btn.textContent='เข้าสู่ระบบ'}});
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=$('#install-btn');if(b)b.hidden=false});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&dp){dpClose();return}
  if(e.key==='Escape'&&$('#modal-root').innerHTML){closeModal();return}
  if(e.key==='Enter'&&e.target.matches('#irows .cin')){e.preventDefault();const row=e.target.closest('tr');const nx=row.nextElementSibling;if(nx){const f=nx.querySelector(`[data-f="${e.target.dataset.f}"]`)||nx.querySelector('.nm');f&&f.focus()}else{$('[data-act="addItem"]').click()}}
  if((e.key==='Enter'||e.key===' ')&&e.target.closest('.landing')&&!e.target.closest('button,input,form')&&TOKEN){entered=true;render()}
});
window.addEventListener('beforeunload',()=>save(true));
render();
})();
</script>
